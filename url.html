<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在打开</title>
</head>
<body>
<script>
(function () {
    var API_BASE = 'https://gooupms.ccwu.cc/hmapi';
    var hasJumped = false;
    var progressBar = null;

    function onReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
    }

    function decodeB64(value) {
        if (!value) return '';
        try {
            var bin = atob(value);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        } catch (e) {
            return '';
        }
    }

    function networkType() {
        var nc = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!nc) return '';
        return nc.effectiveType || nc.type || '';
    }

    function showError(msg) {
        document.body.innerHTML = '';
        var box = document.createElement('div');
        box.style.cssText = 'display:flex;justify-content:center;align-items:center;height:100vh;color:#666;font-family:sans-serif;padding:24px;text-align:center;';
        box.textContent = msg || '打开失败';
        document.body.appendChild(box);
    }

    function setProgress(value) {
        if (progressBar) progressBar.style.width = value + '%';
    }

    function openTarget(url, forceOpen) {
        if (hasJumped || !url) return;
        hasJumped = true;
        setProgress(100);
        if (forceOpen) {
            var wrap = document.createElement('div');
            wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;';
            var iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.referrerPolicy = 'no-referrer';
            iframe.style.cssText = 'width:100%;height:100%;border:0;';
            wrap.appendChild(iframe);
            document.body.appendChild(wrap);
            document.body.style.overflow = 'hidden';
            return;
        }
        window.location.replace(url);
    }

    function showImage(imagePath, seconds, targetUrl) {
        var loading = document.querySelector('.loading');
        if (loading) loading.style.display = 'none';
        var box = document.createElement('div');
        box.style.cssText = 'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;font-family:sans-serif;';
        var img = document.createElement('img');
        img.src = imagePath;
        img.style.cssText = 'max-width:100%;max-height:80vh;';
        var tip = document.createElement('div');
        tip.style.cssText = 'margin-top:12px;color:#666;font-size:14px;';
        box.appendChild(img);
        box.appendChild(tip);
        document.body.appendChild(box);
        var left = seconds;
        tip.textContent = '将在 ' + left + ' 秒后继续';
        img.onclick = function () { openTarget(targetUrl, true); };
        var timer = setInterval(function () {
            left -= 1;
            tip.textContent = '将在 ' + left + ' 秒后继续';
            if (left <= 0) {
                clearInterval(timer);
                openTarget(targetUrl, true);
            }
        }, 1000);
    }

    function renderLoading() {
        var style = document.createElement('style');
        style.textContent = 'html,body{margin:0;height:100%;overflow:hidden;background:#fff}.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.loading-title{font:700 20px sans-serif;background:linear-gradient(180deg,#109b2e,#14d444,#6fce87);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}.progress-track{width:220px;height:8px;background:#e8eef5;border-radius:3px;margin:16px auto;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#109b2e,#14d444,#6fce87)}';
        document.head.appendChild(style);
        var wrap = document.createElement('div');
        wrap.className = 'loading';
        wrap.innerHTML = '<div><div class="loading-title">加载中</div><div class="progress-track"><div class="progress-bar"></div></div></div>';
        document.body.appendChild(wrap);
        progressBar = wrap.querySelector('.progress-bar');
    }

    onReady(function () {
        if (!API_BASE || API_BASE.indexOf('__API_' + 'BASE__') >= 0) {
            showError('入口文件未配置接口地址');
            return;
        }
        var params = new URLSearchParams(location.search);
        var code = decodeB64(params.get('png'));
        var hops = decodeB64(params.get('u')).split('|').filter(Boolean);
        var total = Number(params.get('m') || hops.length) || hops.length;
        var force = params.get('f') === '1';
        var delay = Number(params.get('t') || 500) || 500;
        renderLoading();
        setProgress(Math.max(10, (total - hops.length + 1) * 20));
        if (hops.length) {
            var next = hops.shift();
            document.title = '正在加载..';
            setTimeout(function () {
                var jump = next + (next.indexOf('?') >= 0 ? '&' : '?')
                    + 'u=' + encodeURIComponent(btoa(unescape(encodeURIComponent(hops.join('|')))))
                    + '&m=' + encodeURIComponent(params.get('m') || '')
                    + '&f=' + encodeURIComponent(params.get('f') || '')
                    + '&t=' + encodeURIComponent(params.get('t') || '')
                    + '&png=' + encodeURIComponent(params.get('png') || '');
                location.replace(jump);
            }, delay);
            return;
        }
        if (!code) {
            showError('无效的活码');
            return;
        }
        setProgress(80);
        var url = API_BASE + '/api/open/index?code=' + encodeURIComponent(code) + '&network=' + encodeURIComponent(networkType());
        fetch(url).then(function (res) { return res.json(); }).then(function (json) {
            var data = json && json.data;
            setProgress(98);
            if (typeof data === 'string') {
                showError(data);
                return;
            }
            if (!data || !data.url) {
                showError('打开失败');
                return;
            }
            if (data.title) document.title = data.title;
            if (data.pic) showImage(data.pic, 5, data.url);
            else setTimeout(function () { openTarget(data.url, force); }, 600);
        }).catch(function () {
            showError('网络异常，请重试');
        });
    });
})();
</script>
</body>
</html>
